# Cloudflare Worker config for the Dusk sync proxy.
# Deploy with:  cd worker && wrangler deploy
# The client_secret is NOT here — set it once with:
#   wrangler secret put GOOGLE_CLIENT_SECRET
name = "dusk-sync"
main = "src/index.js"
compatibility_date = "2026-07-28"

# B11-04: логи и трейсы воркера (без них отладка синка вслепую). Сэмплинг полный —
# трафик тут пара устройств, не поток.
[observability]
enabled = true
head_sampling_rate = 1

# B11-04: штатный лимит частоты на токенные эндпойнты, по IP. Живое устройство ходит
# в /refresh примерно раз в час, поэтому 30 запросов в минуту — заведомо выше любого
# честного всплеска и заведомо ниже перебора. ⚠ Требует wrangler ≥ 4.36; если биндинг
# не поднимется, код это переживёт (see rateLimited() — тихо пропускает).
[[ratelimits]]
name = "SYNC_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Non-secret vars. ALLOWED_ORIGIN locks /exchange + /refresh to the app's own
# origin (CORS) so a random site can't use your Worker to mint tokens. Comma-
# separated if more than one. Migrated off GitHub Pages → now just Cloudflare Pages.
[vars]
ALLOWED_ORIGIN = "https://dusk-du4.pages.dev"
GOOGLE_CLIENT_ID = "493121023118-pln1rmhl37q3qi915jhbaqt57a7dkdtv.apps.googleusercontent.com"

# Durable Object that relays cross-device wake nudges over WebSocket.
[[durable_objects.bindings]]
name = "SYNC_ROOM"
class_name = "SyncRoom"

# SQLite-backed DO class — REQUIRED on the free plan (new_sqlite_classes, not new_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRoom"]
