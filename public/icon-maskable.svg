<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- B12-01: MASKABLE-вариант. Лаунчер Android режет иконку своей маской (круг,
       squircle, скруглённый квадрат), гарантированно сохраняя лишь «безопасную зону» —
       круг радиусом 40% стороны (здесь r=204.8 от центра 256,256). У обычной иконки
       том идёт почти в край (углы на r≈102% от порога) и под маской теряет плечи и
       цоколь. Здесь фон полнокровный (маска режет только его), а сам том уменьшен и
       центрирован. Масштаб 0.74 подобран не на глаз, а по КРАЙНИМ точкам арта: самая
       дальняя от центра — нижний угол корпуса (64,448) → после переноса 188.7 от
       центра при пороге 204.8; шпиль (176,48) → 181.6; дно кривой (256,496) → 159.8.
       Запас ~8% оставлен на толщину штриха и на маски строже круга.
       Арт — тот же символ, что в icon-512.svg, ни одна линия не перерисована:
       группа просто масштабируется, поэтому толщины штрихов остаются пропорциональны. -->
  <rect width="512" height="512" fill="#03010a"/>
  <g transform="translate(66.56,48.8) scale(0.74)">
    <path d="M176 48L336 48L448 144L448 448Q256 512 64 448L64 144Z"
          fill="rgba(60,10,130,0.6)" stroke="rgba(180,90,255,0.9)"
          stroke-width="10" stroke-linejoin="round"/>
    <line x1="256" y1="176" x2="256" y2="400"
          stroke="rgba(220,160,255,0.75)" stroke-width="18" stroke-linecap="round"/>
    <line x1="160" y1="272" x2="352" y2="272"
          stroke="rgba(220,160,255,0.75)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="256" cy="112" r="32"
            fill="rgba(180,90,255,0.7)" stroke="rgba(220,160,255,0.8)" stroke-width="8"/>
  </g>
</svg>
